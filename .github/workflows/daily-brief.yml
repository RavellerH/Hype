name: Daily Hyperliquid Brief

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/daily-brief.mjs
        env:
          LLM_ROUTER_URL: ${{ secrets.LLM_ROUTER_URL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          WA_TEMPLATE_LANG: ${{ secrets.WA_TEMPLATE_LANG }}
          WA_CALLMEBOT_PHONE: ${{ secrets.WA_CALLMEBOT_PHONE }}
          WA_CALLMEBOT_APIKEY: ${{ secrets.WA_CALLMEBOT_APIKEY }}
          SIGNAL_COINS: 'BTC,ETH,SOL,HYPE,SUI'
      - name: Commit brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefs/
          git diff --cached --quiet && exit 0
          git commit -m "Daily brief $(date -u +%F)"
          git push origin HEAD:${{ github.ref_name }}
