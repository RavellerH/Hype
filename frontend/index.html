<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hype — Trade Analyzer</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7c6aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hype">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<div class="layout">

  <!-- Topbar -->
  <header class="topbar">
    <span class="logo">⚡ HYPE</span>
    <span class="wallet-badge">0x6e4c…2015</span>
    <div class="topbar-right">
      <button class="btn btn-ghost btn-sm install-btn" id="install-btn" style="display:none" onclick="installPWA()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v13m0 0l-4-4m4 4l4-4"/><path d="M2 17v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2"/></svg>
        Install
      </button>
      <div id="ws-status" class="status-dot off" title="Live connection"></div>
      <button class="notif-btn" id="notif-toggle-btn" onclick="toggleNotifications()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-badge" id="notif-count">0</span>
      </button>
    </div>
  </header>

  <!-- Notification panel -->
  <div class="notif-panel" id="notif-panel">
    <div class="notif-header">
      <span>Notifications</span>
      <button class="btn btn-ghost btn-sm" onclick="markAllRead()">Mark all read</button>
    </div>
    <div id="notif-list"><div class="notif-empty">Loading…</div></div>
  </div>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="nav-section">Portfolio</div>
    <a class="nav-item active" data-page="overview" onclick="navigate('overview')">
      <span class="icon">📊</span> Overview
    </a>
    <a class="nav-item" data-page="trades" onclick="navigate('trades')">
      <span class="icon">🔄</span> Trade History
    </a>
    <a class="nav-item" data-page="funding" onclick="navigate('funding')">
      <span class="icon">💹</span> Funding
    </a>
    <a class="nav-item" data-page="flows" onclick="navigate('flows')">
      <span class="icon">💰</span> Inflow / Outflow
    </a>

    <div class="nav-section" style="margin-top:8px">Analysis</div>
    <a class="nav-item" data-page="phases" onclick="navigate('phases')">
      <span class="icon">🔵</span> Phase Detector
    </a>

    <div class="nav-section" style="margin-top:8px">Tracking</div>
    <a class="nav-item" data-page="watchlist" onclick="navigate('watchlist')">
      <span class="icon">👛</span> Watchlist
    </a>

    <div class="nav-section" style="margin-top:8px">Config</div>
    <a class="nav-item" data-page="settings" onclick="navigate('settings')">
      <span class="icon">⚙️</span> Settings
    </a>
  </nav>

  <!-- Main content -->
  <main class="main">

    <!-- Overview -->
    <div class="page active" id="page-overview">
      <div id="overview-content">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>

    <!-- Trades -->
    <div class="page" id="page-trades">
      <div id="trades-content">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>

    <!-- Funding -->
    <div class="page" id="page-funding">
      <div id="funding-content">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>

    <!-- Flows -->
    <div class="page" id="page-flows">
      <div id="flows-content">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>

    <!-- Phases -->
    <div class="page" id="page-phases">
      <div id="phases-content">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>

    <!-- Watchlist -->
    <div class="page" id="page-watchlist">
      <div id="watchlist-content">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>

    <!-- Settings -->
    <div class="page" id="page-settings">
      <div id="settings-content">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>

  </main>
</div>

<script src="/static/js/app.js"></script>
<script>
  // Service worker registration
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  // PWA install prompt
  let _installPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    _installPrompt = e;
    document.getElementById('install-btn').style.display = 'inline-flex';
  });
  window.addEventListener('appinstalled', () => {
    document.getElementById('install-btn').style.display = 'none';
    _installPrompt = null;
  });
  function installPWA() {
    if (!_installPrompt) return;
    _installPrompt.prompt();
    _installPrompt.userChoice.then(() => { _installPrompt = null; });
  }
</script>
</body>
</html>
