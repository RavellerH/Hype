<!-- Supabase Auth Modal -->
<div class="sb-auth-overlay hidden" id="sb-auth-modal" onclick="event.target===this&&this.classList.add('hidden')">
  <div class="sb-auth-box">
    <h3 class="sb-auth-heading">Sign in to Hype</h3>
    <p class="sb-auth-sub">Sync your KB, trade log &amp; snapshots across devices.</p>
    <input  class="kb-input" id="sb-auth-email"    type="email"    placeholder="Email" autocomplete="email">
    <input  class="kb-input" id="sb-auth-password" type="password" placeholder="Password" autocomplete="current-password">
    <p class="sb-auth-error" id="sb-auth-error"></p>
    <div class="sb-auth-btns">
      <button class="btn btn-primary" onclick="_sbAuthSubmit(false)">Sign in</button>
      <button class="btn"             onclick="_sbAuthSubmit(true)">Sign up</button>
    </div>
  </div>
</div>

<script src="kb.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW:', err));
  }

  let _installPrompt = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    _installPrompt = e;
  });
  window.addEventListener('appinstalled', () => {
    document.getElementById('install-btn').style.display = 'none';
    _installPrompt = null;
  });
  function installPWA() {
    if (_installPrompt) {
      _installPrompt.prompt();
      _installPrompt.userChoice.then(() => { _installPrompt = null; });
    } else if (isIOS) {
      alert('To install: tap the Share button 📤 then "Add to Home Screen"');
    } else {
      alert('To install: open in Chrome or Edge and use the browser menu → "Install app"');
    }
  }
</script>
