    <a class="nav-item"        data-page="intel"     onclick="navigate('intel')"     title="Intel"><span class="icon">📡</span></a>
    <a class="nav-item"        data-page="mvrv"      onclick="navigate('mvrv')"      title="MVRV"><span class="icon">📈</span></a>
    <a class="nav-item"        data-page="ai"        onclick="navigate('ai')"        title="AI"><span class="icon">🤖</span></a>
    <a class="nav-item"        data-page="watchlist" onclick="navigate('watchlist')" title="Watchlist"><span class="icon">👛</span></a>
    <a class="nav-item"        data-page="journal"   onclick="navigate('journal')"   title="Journal"><span class="icon">📓</span></a>

    <button class="bottom-nav-item" data-page="monitor" onclick="navigate('monitor')">
      <span class="bnav-icon">⚡</span><span>Live</span>
    </button>
    <button class="bottom-nav-item" data-page="intel" onclick="navigate('intel')">
      <span class="bnav-icon">📡</span><span>Intel</span>
    </button>
    <button class="bottom-nav-item" data-page="mvrv" onclick="navigate('mvrv')">
      <span class="bnav-icon">📈</span><span>MVRV</span>
    </button>
    <button class="bottom-nav-item" data-page="ai" onclick="navigate('ai')">
      <span class="bnav-icon">🤖</span><span>AI</span>
    </button>
    <button class="bottom-nav-item" data-page="markets" onclick="navigate('markets')">
      <span class="bnav-icon">🌊</span><span>Markets</span>
    </button>
    <button class="bottom-nav-item" data-page="trades" onclick="navigate('trades')">
      <span class="bnav-icon">🔄</span><span>Trades</span>
    </button>

    <div class="page"         id="page-trades"><div id="trades-content"><div class="loading"><div class="spinner"></div> Loading…</div></div></div>
    <div class="page"         id="page-funding"><div id="funding-content"><div class="loading"><div class="spinner"></div> Loading…</div></div></div>

    <div class="page"         id="page-markets"><div id="markets-content"><div class="loading"><div class="spinner"></div> Loading…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="intel.js"></script>
<script src="position-meta.js"></script>
<script src="journal.js"></script>
<script src="app.js"></script>
<script src="mvrv-ai.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW:', err));
  }

  let _installPrompt = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    _installPrompt = e;
  });
  window.addEventListener('appinstalled', () => {
    document.getElementById('install-btn').style.display = 'none';
    _installPrompt = null;
  });
  function installPWA() {
    if (_installPrompt) {
      _installPrompt.prompt();
      _installPrompt.userChoice.then(() => { _installPrompt = null; });
    } else if (isIOS) {
      alert('To install: tap the Share button 📤 then "Add to Home Screen"');
    } else {
      alert('To install: open in Chrome or Edge and use the browser menu → "Install app"');
    }
  }
</script>
</body>
</html>
